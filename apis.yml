    type: Documentation
  - url: https://modal.com/docs/reference/modal.Volume
    type: APIReference
  description: Distributed, high-performance file system volumes for sharing state across functions and containers,
    managed via modal.Volume in the SDK and the `modal volume` CLI. Read/write, commit, and reload operations are
    SDK/CLI-only with no public REST endpoint.
