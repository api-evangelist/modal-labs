apis:
- aid: modal-labs:modal-labs-functions-api
  name: Modal Functions and Remote Invocation
  tags:
  - Functions
  - Remote Execution
  - Serverless
  - SDK
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://modal.com/docs/guide/apps
  properties:
  - url: https://modal.com/docs/guide/apps
    type: Documentation
  - url: https://modal.com/docs/reference/modal.Function
    type: APIReference
  description: Decorate Python functions with @app.function to run them remotely on Modal's cloud. Invoke deployed
    functions synchronously (.remote), asynchronously (.spawn), in parallel (.map), or look them up from another
    app via Function.from_name. This surface is SDK/gRPC-only - there is no first-party REST endpoint; invocation
    happens through the Modal client libraries.
