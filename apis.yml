    type: Documentation
  - url: https://modal.com/docs/reference/modal.Image
    type: APIReference
  description: Define container images programmatically with modal.Image (from_registry, debian_slim,
    pip_install, run_commands) and attach GPUs by passing gpu= (T4, L4, A10, L40S, A100, H100, H200, B200)
    to a function. Image build and GPU attachment are declared in code and resolved by the gRPC backend;
    no public REST endpoint.
