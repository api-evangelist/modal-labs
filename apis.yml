aid: modal-labs
url: https://raw.githubusercontent.com/api-evangelist/modal-labs/refs/heads/main/apis.yml
name: Modal
kind: company
description: Modal is a serverless cloud for AI, data, and general compute. Developers define infrastructure as
  code in Python (with JavaScript and Go SDKs) and run functions, GPUs, sandboxes, web endpoints, cron jobs, and
  volumes on demand. The primary developer interface is the Modal SDK and CLI communicating with a gRPC backend,
  not a conventional first-party REST API. User-deployed Modal Functions can be exposed as HTTPS web endpoints (@modal.fastapi_endpoint
  / asgi_app / wsgi_app / web_server) on *.modal.run, and Sandboxes can expose ports via network tunnels.
