description: >-
  Modal's error contract is a published Python exception hierarchy, not an HTTP
  problem catalogue. This is the non-payments sibling of a decline-code
  reference: the `modal.exception` module is a named, documented registry of 49
  error classes with one-line meanings, 11 of which carry the
  _GRPCErrorWrapper mixin and therefore map directly onto a gRPC status returned
  by the control plane. An agent driving Modal through the SDK catches these
  names; it will never see an application/problem+json body.
envelope:
  style: gRPC status code + message, surfaced as a typed Python exception
  problem_json: false
  problem_json_note: >-
    RFC 9457 does not apply — there is no REST surface on the control plane. On a
    deployed *.modal.run endpoint the error body is whatever the developer's own
    framework emits; Modal's edge proxy contributes only a plain-text 401 for
    missing proxy credentials.
  http_codes_seen:
  - code: 401
    surface: '*.modal.run'
    body: 'modal-http: missing credentials for proxy authorization'
    source: https://modal.com/docs/guide/webhook-proxy-auth
  - code: 413
    surface: control plane
    meaning: Content Too Large — request payload exceeds the limit.
    source: https://modal.com/docs/guide/troubleshooting
base_class: modal.exception.Error
grpc_mapped_count: 11
error_count: 49
notes: >-
  Titles are quoted verbatim from the reference docs. A blank title means the
  class is published without a docstring; it is recorded rather than invented.
