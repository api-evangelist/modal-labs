provider: Modal
providerId: modal-labs
description: >-
  Modal ships three first-party client SDKs — Python (the primary interface,
  which also carries the `modal` CLI), JavaScript/TypeScript, and Go. All three
  are developed in the single public monorepo modal-labs/modal-client, which
  also publishes the gRPC .proto files the SDKs are generated against. Python is
  GA; the JavaScript and Go SDKs are documented as Beta and version in lockstep
  (both at 0.10.1, tagged `go/v0.10.1` in the same repo).
