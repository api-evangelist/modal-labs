current_version: 1.5.5
current_released: '2026-08-28'
cadence: >-
  Roughly every two to six weeks; six releases in the 1.5 line between 2026-06-09
  and 2026-08-28.
breaking_change_policy: >-
  Breaking changes are limited to Y-version increments of X.Y.Z (see
