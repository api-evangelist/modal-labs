entries:
- version: 1.5.5
  date: '2026-08-28'
  breaking: false
  additions:
  - modal.Sandbox.logs with fetch() and tail() over a date/time range.
  - Configurable default role when creating a Restricted Environment.
  - Global --profile option on the CLI.
  deprecations:
  - Undocumented object-type APIs deprecated; removal in 1.6.0.
- version: 1.5.4
  date: '2026-08-12'
  breaking: false
  additions:
  - App.logs (fetch/tail/stream) and Image.logs (fetch/tail) for build logs.
  - modal image logs CLI command.
  - Workspace.billing.rates() and `modal billing rates`.
  - Fractional target_concurrency for autoscaling.
  highlights:
  - >-
    Opt-in Sandbox V2 backend via MODAL_SANDBOX_V2=1, with substantially higher
    creation rates and concurrency; becomes the default in 1.6.0.
  deprecations:
  - FileIO-based Sandbox filesystem API unsupported under Sandbox V2.
- version: 1.5.3
  date: '2026-07-23'
  breaking: false
  additions:
  - Log APIs on Function, Server and FunctionCall (stream/fetch/tail).
  - Workspace and Environment billing summaries, plus matching CLIs.
  - Environment.roles interface replacing Environment.members.
  - --compute-region on modal endpoint create.
  highlights:
  - Roughly 2.5x faster large writes in Sandbox filesystem methods.
- version: 1.5.2
  date: '2026-07-10'
  breaking: false
  additions:
  - Workspace.settings.list()/set() and matching CLI.
  - modal.types module exposing public dataclasses.
  - routing_region on Function.with_options().
  - --graceful flag on modal container stop.
- version: 1.5.1
  date: '2026-06-23'
  breaking: false
  additions:
  - '@app.server() decorator and modal.Server — a low-latency HTTP compute primitive.'
  - modal endpoint CLI for deploying LLM inference endpoints.
  - Proxy token create/list APIs and `modal workspace proxy-tokens`.
  - modal curl for calling authenticated endpoints (experimental).
  - --strategy (rolling or recreate) on modal app rollback.
  highlights:
  - Two new product surfaces (Servers and Endpoints) shipped in one release.
- version: 1.5.0
  date: '2026-06-09'
  breaking: false
