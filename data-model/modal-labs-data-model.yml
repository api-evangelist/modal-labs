  relationships:
  - belongs_to: Workspace
    via: workspace_id
  - has_many: App
    via: app_id
  - has_many: Secret
    via: secret_id
- name: App
  rpcs: 24
  description: >-
    Deployable unit grouping functions, classes and resources; versioned, with
