  relationships:
  - belongs_to: App
    via: app_id
  - has_one: Image
    via: image_id
  - has_many: FunctionCall
    via: function_call_id
  - has_many: Secret
    via: secret_ids
- name: FunctionCall
  rpcs: 8
  description: >-
    A single invocation of a Function, cancellable while running, with inputs and
