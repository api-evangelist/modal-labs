x-source: openapi/modal-labs-modal-web-endpoints-representative-api-openapi.yml
x-note: >-
  This overlay never mutates the underlying document. It records what API
  Evangelist knows about Modal that the representative spec cannot state for
  itself — above all that the spec is a SHAPE, not a first-party contract: the
