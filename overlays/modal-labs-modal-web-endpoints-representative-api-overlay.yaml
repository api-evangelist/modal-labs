        recommend using official SDKs instead."
    x-authentication:
      inbound-proxy-auth:
        headers:
        - Modal-Key
        - Modal-Secret
        enforced-by: Modal edge proxy, before user code runs
        docs: https://modal.com/docs/guide/webhook-proxy-auth
    x-artifacts:
      conventions: conventions/modal-labs-conventions.yml
      errors: errors/modal-labs-problem-types.yml
