  description: Flag the write surface for agent governance.
  update:
    x-agentic-access:
      action-class: acting
      consequence: write
      reversibility: >-
        Not determinable from this document — the reversal path belongs to the
        developer's own application. See conventions/modal-labs-conventions.yml
        for the platform-level reversibility Modal itself publishes.
- target: $.paths['/{proxy}'].get
  description: Mark the catch-all as developer-owned surface.
  update:
    x-not-modal-owned: true
    x-note: >-
      Any route the developer's mounted ASGI/WSGI application exposes is
      reachable here. Modal defines the host, not the routes.
