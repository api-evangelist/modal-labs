description: >-
  Modal publishes NO first-party MCP server — neither a hosted endpoint nor a
  stdio package. Searched the docs, llms.txt, the modal-labs GitHub org and the
  package registries on 2026-09-18 and found only (a) a documentation example
  showing a customer how to DEPLOY their own stateless MCP server on Modal with
  FastMCP, which is Modal as the host rather than Modal as the server, and (b)
  `mcp-modal` on PyPI, which is third-party — authored by George Bobby at
  github.com/george-bobby/mcp-modal, not by Modal Labs.
  Modal's chosen agent surface is an Agent Skill instead: it ships SKILL.md
  inside the `modal` distribution and installs it with `modal skills install`.
  See skills/_index.yml. No MCPServer pointer is wired in apis.yml, because a
  pointer would assert Modal serves a surface it does not.
