generated: '2026-09-18'
method: probed
source: live HTTPS probes of every host in apis.yml plus oidc.modal.com, named in Modal's own OIDC integration guide
description: >-
  Modal serves no /.well-known documents on its primary domain. It DOES serve a
  real OpenID Connect discovery document — and the JWKS it points at — on a
  third host, oidc.modal.com, which is named only inside the OIDC integration
  guide (https://modal.com/docs/guide/oidc-integration). Probing modal.com alone
  would have scored this provider zero on a document it genuinely publishes.
notes: >-
  api.modal.com answers HTTP 200 with content-type application/grpc and a
  zero-byte body on EVERY path, /.well-known/* included. That is a gRPC
  catch-all, not a document — every such row is recorded as a miss.
  modal.com returns a 404 status with a 57KB SPA shell for every /.well-known
  path. oidc.modal.com is fronted by S3 and returns 403 AccessDenied for any
  key that does not exist, which is its way of saying 404.
hosts:
- host: oidc.modal.com
  documents:
  - path: /.well-known/openid-configuration
    status: 200
    content_type: application/json
    file: modal-labs-oidc-openid-configuration.json
    note: >-
      Real OIDC discovery document. issuer https://oidc.modal.com, RS256 id_token
      signing, scopes_supported [openid], and Modal-specific claims
      (workspace_id, environment_name, app_name, function_name, container_id)
      that identify the calling Modal Function to an external service.
  - path: /.well-known/jwks.json
    status: 200
    content_type: application/json
    file: modal-labs-oidc-jwks.json
    note: Signing keys referenced by jwks_uri in the discovery document.
